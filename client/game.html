<!doctype html>

<!--game.html
Mostra il nome del giocatore e il numero di mostri sconfitti.
Mostra HP e MP del giocatore con barre <progress>.
Mostra il nome e gli HP del mostro corrente.
Contiene tre pulsanti: Attacco, Magia e Cura.
Mostra il risultato dell'ultima azione.
Mostra il record globale.
Quando il giocatore muore, mostra il punteggio finale e permette di iniziare una nuova partita.
-->

<html lang="it">
  <head>
    <title>Game</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  
  <body>
    <div id="info-partita">
      <span id="NomeGiocatore"></span>
      <span id="num-mostri">0</span>
      <span id="record-globale"></span>
    </div>

    <div id="giocatore">
      <label for="hp-giocatore"></label>
      <progress id="hp-giocatore" max="100" value="100"></progress
      ><span id="testoHp">100/100</span>
      <label for="mp-giocatore"></label>
      <progress id="mp-giocatore" max="100" value="100"></progress
      ><span id="testoMp">100/100</span>
    </div>
    <div id="mostro">
      <span id="NomeMostro"></span>
      <label for="hp-mostro"></label>
      <progress id="hp-mostro" max="100" value="100"></progress
      ><span id="testoHp">100/100</span>
    </div>

    <div id="azioni">
      <button id="attacco">Attacco</button>
      <button id="magia">Magia</button>
      <button id="cura">Cura</button>
    </div>

    <div id="game-over" hidden>
      <span id="punteggio-finale"></span>
      <button id="restart"></button>
    </div>

    <script src="js/game.js"></script>

  </body>
</html>
