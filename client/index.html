<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Monster Arena</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <div id="header">
            <h1>Monster Arena</h1>
        </div>

        <div id="setup">
            <div class="record-box">
                <h3>Record: <span id="record-attuale">Nessun Record</span></h3>
            </div>

            <form id="setup-form">
                <div class="input-group">
                    <label for="NomeGiocatore">Nome Giocatore:</label>
                    <input type="text" id="NomeGiocatore" name="NomeGiocatore" placeholder="XxD4rkVolp0xX" required>
                </div>

                <div class="avatar-selection">
                    <legend>Scegli il tuo Mostro:</legend>
                    
                    <div class="avatar-grid">
                        <label class="avatar-option">
                            <input type="radio" name="avatar" value="drago" checked>
                            <span class="avatar-card">🐉Drago</span>
                        </label>

                        <label class="avatar-option">
                            <input type="radio" name="avatar" value="golem">
                            <span class="avatar-card">🗿Golem</span>
                        </label>

                        <label class="avatar-option">
                            <input type="radio" name="avatar" value="spettro">
                            <span class="avatar-card">👻Spettro</span>
                        </label>

                        <label class="avatar-option">
                            <input type="radio" name="avatar" value="demone">
                            <span class="avatar-card">👹Demone</span>
                        </label>
                    </div>
                </div>

                <button type="submit">Inizia Partita</button>
            </form>
        </div>

        <script src="index.html"></script>

    </body>
</html>
